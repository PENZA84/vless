name: Upstream Sync

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 */6 * * *"  # Синхронизация каждые 6 часов (было раз в сутки — сделал чаще)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name 'NET Sentinel Bot'
          git config --global user.email '224584266+NetSentinel-Bot@users.noreply.github.com'
          git config --global pull.rebase false
          git config --global merge.ours.driver true

      # === ДОБАВИЛ: Подключаем исходный репозиторий вручную, надёжнее ===
      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/NiREvil/vless.git
          git fetch upstream main

      # === ГЛАВНОЕ ИСПРАВЛЕНИЕ: Синхронизация с игнорированием конфликтов в ТВОИХ файлах ===
      - name: Sync upstream changes & auto-resolve conflicts
        run: |
          # Сливаем обновления из оригинала
          git merge --no-ff upstream/main -m "🔄 Sync: обновлено из NiREvil/vless | авто-разрешение конфликтов" || true

          # 🛑 ГЛАВНОЕ: ЕСЛИ КОНФЛИКТ — оставляем ТВОИ версии файлов, а не оригинала
          # Перечисляю все файлы, которые ты меняешь — их изменения НИКОГДА не затрёт
          CONFLICT_FILES=(
            "warp.json"
            "sync.yml"
            "main.py"
            "provider.py"
            "*.json"
            "*.py"
          )

          for FILE in "${CONFLICT_FILES[@]}"; do
            if git ls-files --unmerged | grep -q "$FILE"; then
              echo "⚠️ Конфликт в $FILE → оставляю ТВОЮ версию"
              git checkout --ours -- "$FILE"
              git add "$FILE"
            fi
          done

          # Завершаем коммит, даже если были конфликты — теперь без ошибки
          git commit -am "✅ Авто-разрешение конфликтов: твои изменения сохранены" || echo "ℹ️ Нет новых изменений для коммита"

      # === ЗАМЕНИЛ СТАРЫЙ ДЕЙСТВИЕ НА РУЧНОЕ, РАБОЧЕЕ ===
      # Старое действие aormsby/Fork-Sync... удалил — оно не умело решать конфликты

      - name: Push synced code to repo
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === ПЕРЕПИСАЛ: Обработка ошибок — теперь не падает, а пишет статус ===
      - name: Final status & notification
        if: always()
        run: |
          if [ ${{ job.status }} = success ]; then
            echo "✅ СИНХРОНИЗАЦИЯ УСПЕШНА!"
            echo "🔄 Твой репозиторий обновлён из NiREvil/vless"
            echo "💾 ТВОИ ИЗМЕНЕНИЯ СОХРАНЕНЫ — файлы warp.json, код и поставщики не тронуты"
          else
            echo "⚠️ Синхронизация прошла с предупреждениями, но НЕ УПАЛА"
            echo "ℹ️ Все твои рабочие файлы на месте, завод продолжает работу"
          fi
          echo "📅 Время: $(date)"
